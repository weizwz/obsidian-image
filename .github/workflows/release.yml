name: Release Obsidian plugin

on:
  push:
    branches:
      - master
    paths:
      - 'manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Build plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Check for optional styles
        id: styles
        run: |
          [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(jq -r '.version' manifest.json)

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            exit 0
          fi

          gh release create "$tag" \
            --target "${GITHUB_SHA}" \
            --title "$tag" \
            --generate-notes \
            dist/main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
